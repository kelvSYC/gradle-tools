# gradle-tools-specific entries only. Everything else (libraries, plugins, the platform) comes from the shared catalog
# that the com.kelvsyc.internal.settings plugin registers as `libs`; this file is registered as the `local` catalog
# (see gradle/settings) in every build that applies the gradle-tools settings plugin. The gradle/settings build itself
# has no shared plugin applied yet, so there it is the `libs` catalog and resolves the shared settings plugin.
# gradle-build-conventions pins the shared build conventions version once: the settings plugin's version determines
# the shared catalog and platform versions.
[versions]
gradle-build-conventions = "0.7.5"
kotlin-tools = "0.7.0"
ant = "1.10.18"

[libraries]
conventions-settings-plugin = { module = "com.kelvsyc.internal:settings-plugin", version.ref = "gradle-build-conventions" }

# API Dependencies
# Explicit versions: the shared platform does not manage kotlin-tools.
kotlin-tools-moshi-extensions = { module = "com.kelvsyc.kotlin:moshi-extensions", version.ref = "kotlin-tools" }
kotlin-tools-snakeyaml-extensions = { module = "com.kelvsyc.kotlin:snakeyaml-extensions", version.ref = "kotlin-tools" }
kotlin-tools-xml-extensions = { module = "com.kelvsyc.kotlin:xml-extensions", version.ref = "kotlin-tools" }

# Ant for the ant-bridge core's tests and shim compilation; the plugin's own default is a constant that a test checks against `ant`.
ant = { module = "org.apache.ant:ant", version.ref = "ant" }
ant-junit = { module = "org.apache.ant:ant-junit", version.ref = "ant" }
ant-contrib = { module = "ant-contrib:ant-contrib", version = "1.0b3" }
