name: Conventions bump
on:
  pull_request:
    types: [opened, reopened, synchronize]

# On a Dependabot PR bumping gradle-build-conventions: moves the Gradle wrapper to the Gradle version that release is
# built for (.github/scripts/follow-conventions-gradle.sh), then enables GitHub auto-merge, so the PR merges once the
# required checks pass. Pushing and enabling auto-merge use the CONVENTIONS_TOKEN personal access token: a push or
# merge made with GITHUB_TOKEN triggers no workflows, so CI would not run on the wrapper change and nothing would be
# published after the merge. A run started by Dependabot sees only Dependabot secrets, and one started by the token's
# own push only Actions secrets, so the token is stored in both. Only the push and auto-merge steps get the token: the
# Gradle build that refreshes the wrapper runs the build's plugins, which must not see it. A further step labels the PR
# `release:minor` when a library in the new release moves across a breaking version
# (.github/scripts/conventions-moves.sh); it uses GITHUB_TOKEN.
jobs:
  follow-and-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Check for a conventions bump
        id: bump
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
          HAS_TOKEN: ${{ secrets.CONVENTIONS_TOKEN != '' }}
        run: |
          if [[ ",${DEPENDENCIES// /}," != *",com.kelvsyc.internal:settings-plugin,"* ]]; then
            echo "Not a gradle-build-conventions bump: ${DEPENDENCIES}"
            echo "conventions=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CONVENTIONS_TOKEN is not set in this repository's Dependabot and Actions secrets."
            exit 1
          fi
          echo "conventions=true" >> "$GITHUB_OUTPUT"
      - name: Checkout
        if: steps.bump.outputs.conventions == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
      - name: Set up JDK 21
        if: steps.bump.outputs.conventions == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Follow the conventions' Gradle version
        id: follow
        if: steps.bump.outputs.conventions == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/follow-conventions-gradle.sh
      - name: Push the wrapper change
        if: steps.follow.outputs.changed == 'true'
        env:
          GRADLE_VERSION: ${{ steps.follow.outputs.gradle }}
          CONVENTIONS_TOKEN: ${{ secrets.CONVENTIONS_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper gradlew gradlew.bat
          git commit -m "Follow gradle-build-conventions to Gradle ${GRADLE_VERSION}"
          git push "https://x-access-token:${CONVENTIONS_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${BRANCH}"
      - name: Label breaking library moves
        if: steps.bump.outputs.conventions == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          pin_regex='s/^gradle-build-conventions *= *"([^"]+)".*/\1/p'
          old=$(git show "${BASE_SHA}:gradle/libs.versions.toml" | sed -nE "$pin_regex")
          new=$(sed -nE "$pin_regex" gradle/libs.versions.toml)
          if [ -z "$old" ] || [ -z "$new" ]; then
            echo "::error::No gradle-build-conventions pin found (old='${old}', new='${new}')."
            exit 1
          fi
          if [ "$old" = "$new" ]; then
            echo "The conventions pin did not change."
            exit 0
          fi
          base_url=https://maven.pkg.github.com/kelvSYC/gradle-build-conventions/com/kelvsyc/internal
          work=$(mktemp -d)
          for v in "$old" "$new"; do
            curl -fsSL --retry 3 --retry-all-errors -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" -o "$work/platform-$v.pom" "$base_url/platform/$v/platform-$v.pom"
            curl -fsSL --retry 3 --retry-all-errors -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" -o "$work/catalog-$v.toml" "$base_url/catalog/$v/catalog-$v.toml"
            .github/scripts/conventions-moves.sh versions "$work/platform-$v.pom" "$work/catalog-$v.toml" > "$work/versions-$v"
          done
          moves=$(.github/scripts/conventions-moves.sh breaking "$work/versions-$old" "$work/versions-$new")
          if [ -z "$moves" ]; then
            echo "No library moves across a breaking version between ${old} and ${new}."
            exit 0
          fi
          gh pr edit "$PR_URL" --add-label release:minor
          {
            echo "### Breaking library moves (${old} -> ${new})"
            echo
            echo '```'
            echo "$moves"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enable auto-merge
        if: steps.bump.outputs.conventions == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONVENTIONS_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
